<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Futsal Online</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body { background-color: #020617; position: fixed; inset: 0; display: flex; flex-direction: column; font-family: sans-serif; }
        .central-hud { height: 70px; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 1000; color: white; gap: 15px; position: relative; border-bottom: 2px solid #334155; }
        .view-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #0f172a 0%, #020617 100%); overflow: hidden; }
        canvas { background-color: #064e3b; max-width: 100%; max-height: 100%; }
        .overlay-screen { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98); z-index: 500; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .btn-primary { background: #2563eb; color: white; padding: 14px 25px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; margin-top: 10px; width: 100%; max-width: 280px; }
        .btn-red { background: #ef4444; }
        .input-box { padding: 12px; font-size: 1.2rem; width: 100%; text-align: center; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-weight: bold; margin-bottom: 15px; }
        #goal-anim-container { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 999; pointer-events: none; background: rgba(0,0,0,0.65); }
        .goal-text { font-size: 5.5rem; font-weight: 900; color: #fbbf24; text-shadow: 6px 6px 0px #ef4444; font-style: italic; animation: pop-in 3s ease-out forwards; }
        @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 10% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body>
    <div id="main-menu" class="overlay-screen">
        <h1 style="color:white; margin:20px;">FUTSAL ONLINE</h1>
        <div style="background:#1e293b; padding:20px; border-radius:12px; width:100%; max-width:300px;">
            <input type="text" id="player-name" class="input-box" placeholder="Nombre" maxlength="10">
            <input type="color" id="player-color" value="#3b82f6" style="width:100%; height:40px;">
        </div>
        <button class="btn-primary" onclick="createRoom()">CREAR SALA</button>
        <input type="text" id="join-code" class="input-box" style="margin-top:20px;" placeholder="CÓDIGO">
        <button class="btn-primary" onclick="joinRoom()">ENTRAR</button>
        <div id="history-list" style="margin-top:20px; width:300px;"></div>
    </div>
    <div id="lobby-screen" class="overlay-screen" style="display:none;">
        <h2 id="room-code-display" style="color:#10b981;">----</h2>
        <button id="btn-ready" class="btn-primary" onclick="setReady()">LISTO</button>
        <button class="btn-primary btn-red" onclick="leaveRoom()">SALIR</button>
    </div>
    <div class="central-hud">
        <div id="team-label" class="team-indicator"></div>
        <div id="timer" class="timer-box">03:00</div>
    </div>
    <div class="view-container">
        <div id="goal-anim-container"></div>
        <canvas id="gameCanvas" width="500" height="900"></canvas>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // CAMBIA ESTO POR TU URL REAL DE RENDER
        const socket = io("https://tu-juego.onrender.com");
        
        // ... (resto del script igual que antes) ...
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WORLD_W = 500, WORLD_H = 900;
        let myTeam = null, myRoomCode = null, gameState = null, selectedPlayer = null, drag = { active: false };

        function setReady() { socket.emit('setReady'); document.getElementById('btn-ready').disabled = true; }
        function leaveRoom() { socket.emit('leaveRoom'); document.getElementById('lobby-screen').style.display='none'; document.getElementById('main-menu').style.display='flex'; }
        
        socket.on('init', (data) => {
            myTeam = data.team; myRoomCode = data.roomCode;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('room-code-display').innerText = myRoomCode;
        });

        socket.on('stateUpdate', (state) => {
            gameState = state;
            if(state.status === 'playing') document.getElementById('lobby-screen').style.display = 'none';
        });

        function render() {
            if (!gameState) { requestAnimationFrame(render); return; }
            ctx.clearRect(0,0,WORLD_W,WORLD_H);
            gameState.players.forEach(p => {
                ctx.beginPath(); ctx.arc(myTeam === 'p2' ? WORLD_W - p.x : p.x, myTeam === 'p2' ? WORLD_H - p.y : p.y, 22, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.fill(); ctx.stroke();
            });
            ctx.beginPath(); ctx.arc(myTeam === 'p2' ? WORLD_W - gameState.ball.x : gameState.ball.x, myTeam === 'p2' ? WORLD_H - gameState.ball.y : gameState.ball.y, 11, 0, Math.PI*2);
            ctx.stroke();
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
