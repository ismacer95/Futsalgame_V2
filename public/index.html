<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futsal Online</title>
</head>
<body style="background:#020617; color:white; font-family:sans-serif; text-align:center;">
    <div id="main-menu" style="padding:20px;">
        <h1>FUTSAL ONLINE</h1>
        <input type="text" id="player-name" placeholder="Nombre" style="padding:10px; width:100%; max-width:300px;"><br><br>
        <input type="color" id="player-color" value="#3b82f6" style="width:100%; max-width:300px;"><br><br>
        <button onclick="createRoom()" style="padding:15px; width:100%; max-width:300px;">CREAR SALA</button><br><br>
        <input type="text" id="join-code" placeholder="CÓDIGO" style="padding:10px; width:100%; max-width:300px;"><br><br>
        <button onclick="joinRoom()" style="padding:15px; width:100%; max-width:300px;">ENTRAR</button>
    </div>
    <div id="lobby-screen" style="display:none; padding:20px;">
        <h2 id="room-code-display">CÓDIGO: ----</h2>
        <button id="btn-ready" onclick="socket.emit('setReady')">LISTO</button>
        <button onclick="location.reload()">SALIR</button>
    </div>
    <canvas id="gameCanvas" width="500" height="900" style="background:#064e3b; width:100%; max-width:500px;"></canvas>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- CAMBIA ESTO POR TU URL REAL ---
        const socket = io("https://futsalgame-v2.onrender.com");
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let myTeam = null, gameState = null;

        function createRoom() { socket.emit('createRoom', { name: document.getElementById('player-name').value, color: document.getElementById('player-color').value }); }
        function joinRoom() { socket.emit('joinRoom', { code: document.getElementById('join-code').value, name: document.getElementById('player-name').value, color: document.getElementById('player-color').value }); }

        socket.on('init', (d) => {
            myTeam = d.team;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            document.getElementById('room-code-display').innerText = "CÓDIGO: " + d.roomCode;
        });

        socket.on('stateUpdate', (s) => { gameState = s; if(s.status === 'playing') document.getElementById('lobby-screen').style.display = 'none'; });

        function render() {
            if (gameState) {
                ctx.clearRect(0,0,500,900);
                gameState.players.forEach(p => {
                    ctx.beginPath(); ctx.arc(myTeam === 'p2' ? 500-p.x : p.x, myTeam === 'p2' ? 900-p.y : p.y, 20, 0, Math.PI*2);
                    ctx.fillStyle = p.color; ctx.fill();
                });
                ctx.beginPath(); ctx.arc(myTeam === 'p2' ? 500-gameState.ball.x : gameState.ball.x, myTeam === 'p2' ? 900-gameState.ball.y : gameState.ball.y, 10, 0, Math.PI*2);
                ctx.fillStyle = 'white'; ctx.fill();
            }
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
